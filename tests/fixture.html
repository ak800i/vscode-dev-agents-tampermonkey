<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
  <style>
    body { margin: 0; font: 14px system-ui; }
    .part.titlebar { height: 44px; }
    .part.sessionspart { padding: 8px; }
    .interactive-session { position: relative; }
    .interactive-input-editor { position: relative; height: 120px; }
    .monaco-editor { height: 120px; width: 360px; }
    .part.sidebar, .part.editor { display: none; }
    .model-picker-config { display: none; }
    .interactive-request { margin: 16px 0; }
    .chat-markdown-part { padding: 12px; background: #ddd; }
    .session-chat-twistie { display: inline-block; width: 20px; height: 30px; }
    .session-item { display: inline-block; }
    .session-title { font-size: 13px; }
    .prompt-timeline-rail { position: absolute; left: 0; top: 120px; z-index: 20; }
    .prompt-timeline-gutter-rest { min-width: 24px; min-height: 44px; }
    .prompt-timeline-gutter-panel {
      position: absolute; left: 24px; top: -80px; width: 300px; max-height: 240px;
      overflow: auto; background: white; border: 1px solid;
    }
    .prompt-timeline-gutter-row-jump { display: block; width: 100%; min-height: 44px; }
    [role="dialog"] { position: fixed; z-index: 2500; top: 50px; left: 8px; background: white; padding: 12px; border: 1px solid; }
  </style>
  <link rel="stylesheet" href="/fixture-runtime.css">
</head>
<body>
  <div class="monaco-workbench agent-sessions-workbench nosidebar noauxiliarybar noeditorpane">
    <div class="part titlebar" id="workbench.parts.titlebar">
      <button aria-label="Toggle Side Bar (Ctrl+B)">Sessions</button>
      <button aria-label="Toggle Side Panel (Ctrl+Alt+B)">Files</button>
      <button aria-label="Signed in with GitHub">Account</button>
    </div>
    <div class="part sidebar" id="workbench.parts.sidebar">
      <div class="content" style="width: 270px">
        <div class="agent-sessions-control-container" style="width: 270px">
          <div class="sessions-list-control" style="width: 270px">
            <div class="monaco-list" role="tree" aria-label="Sessions" style="width: 270px">
              <div role="treeitem" aria-label="Parent session" aria-expanded="true">
                <div class="monaco-tl-twistie collapsible session-chat-twistie">v</div>
                <div class="session-item"><span class="session-title">Parent session</span></div>
              </div>
              <div role="treeitem" aria-label="Child session">Child session</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="part sessionspart" id="workbench.parts.sessions">
      <div class="interactive-session">
        <div role="list" aria-label="Chat">
          <div class="interactive-item-container interactive-request" tabindex="0">
            <div class="value">
              <div class="chat-markdown-part rendered-markdown clickable" tabindex="0">
                <p>Previously sent prompt <a href="#reference">reference</a></p>
              </div>
            </div>
          </div>
          <div class="interactive-item-container interactive-response">
            <div class="value"><div class="rendered-markdown"><p>Response text to select.</p></div></div>
          </div>
        </div>
        <div class="interactive-input-part">
          <div class="chat-input-container">
            <div class="chat-editor-container">
              <div class="interactive-input-editor"></div>
            </div>
            <div class="chat-input-toolbar">
              <div class="model-picker-split" role="group" aria-label="Models, Example Model">
                <button class="model-picker-name" aria-label="Models, Example Model">Example Model</button>
                <button class="model-picker-config model-picker-config-summary"
                  aria-label="Example Model details, Thinking Level: High, Context Size: 200K">High - 200K</button>
              </div>
              <button class="native-send" aria-label="Send">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="part editor" id="workbench.parts.editor"><div>Files</div></div>
  </div>
  <script>
    const initialLayout = navigator.userAgent.includes('Mobi') && innerWidth < 640 ? 'phone' : 'desktop';
    document.querySelector('.monaco-workbench').classList.toggle('phone-layout', initialLayout === 'phone');
    window.initializeFixtureRuntime = (monaco, List, Gesture, Menu, Action) => {
      const editorHost = document.querySelector('.interactive-input-editor');
      const editor = monaco.editor.create(editorHost, {
        value: '',
        language: 'plaintext',
        ariaLabel: 'Chat Input',
        minimap: { enabled: false },
        wordWrap: 'on',
        scrollBeyondLastLine: false,
        automaticLayout: true,
        editContext: false,
      });
      const fixture = window.fixture = {
        editor,
        initialLayout,
        sends: [],
        openedSessions: 0,
        edits: 0,
        editKeys: [],
        menus: 0,
        nativePointerDowns: 0,
        modelOpens: 0,
        detailsOpens: 0,
        setText: value => editor.setValue(value),
        text: () => editor.getModel().getValue(monaco.editor.EndOfLinePreference.LF),
      };
      fixture.mountTranscript = (count = 200, { dynamicHeights = false, timeline = false } = {}) => {
        document.querySelector('.interactive-session > [role="list"]')?.remove();
        const host = document.createElement('div');
        host.className = 'interactive-list';
        host.style.height = '340px';
        document.querySelector('.interactive-session').prepend(host);
        const renderer = {
          templateId: 'message',
          renderTemplate(container) {
            const row = document.createElement('div');
            row.className = 'interactive-item-container';
            const body = document.createElement('div');
            body.className = 'rendered-markdown clickable';
            body.style.whiteSpace = 'normal';
            body.style.padding = '8px';
            const paragraph = document.createElement('p');
            body.append(paragraph);
            row.append(body);
            container.append(row);
            const template = { row, body, paragraph };
            body.addEventListener('click', () => {
              if (row.classList.contains('interactive-request') && !window.getSelection().toString()) fixture.edits++;
            });
            return template;
          },
          renderElement(item, index, template) {
            template.row.classList.toggle('interactive-request', item.request);
            template.row.classList.toggle('interactive-response', !item.request);
            template.row.dataset.messageIndex = String(item.index);
            template.paragraph.textContent = `Message ${item.index}: readable conversation content for scrolling and selection.`;
            if (dynamicHeights) template.paragraph.textContent += ' Additional variable-height content.'.repeat(index % 3);
          },
          disposeTemplate() {},
        };
        const list = new List('transcript-fixture', host, {
          getHeight: () => 120,
          hasDynamicHeight: () => dynamicHeights,
          getTemplateId: () => 'message',
        }, [renderer], {
          accessibilityProvider: {
            getAriaLabel: item => `Message ${item.index}`,
            getWidgetAriaLabel: () => 'Chat transcript',
          },
          keyboardSupport: false,
          mouseSupport: true,
          smoothScrolling: false,
          supportDynamicHeights: dynamicHeights,
        });
        list.layout(340, host.clientWidth);
        list.splice(0, 0, Array.from({ length: count }, (_, index) => ({ index, request: index % 3 === 0 })));
        list.onContextMenu(() => fixture.menus++);
        fixture.transcript = list;
        if (timeline) {
          const rail = document.createElement('div');
          rail.className = 'prompt-timeline-rail prompt-timeline-rail-gutter';
          const rest = document.createElement('button');
          rest.className = 'prompt-timeline-gutter-rest';
          rest.setAttribute('aria-label', 'Show prompts');
          rest.textContent = '...';
          const panel = document.createElement('div');
          panel.className = 'prompt-timeline-gutter-panel';
          panel.hidden = true;
          let open = false;
          let hovering = false;
          const update = () => {
            panel.hidden = !open && !hovering;
            rest.setAttribute('aria-expanded', String(!panel.hidden));
          };
          const toggle = () => {
            open = !open;
            update();
            if (open) panel.firstElementChild?.focus();
            else rest.focus();
          };
          rail.addEventListener('mouseover', () => { hovering = true; update(); });
          rail.addEventListener('mouseout', event => {
            if (!rail.contains(event.relatedTarget)) { hovering = false; update(); }
          });
          Gesture.addTarget(rest);
          rest.addEventListener('click', event => { event.preventDefault(); toggle(); });
          rest.addEventListener('-monaco-gesturetap', toggle);
          fixture.timelineJumps = [];
          for (let index = 0; index < count; index += 3) {
            const jump = document.createElement('button');
            jump.className = 'prompt-timeline-gutter-row-jump';
            jump.textContent = `Prompt ${index}`;
            jump.addEventListener('click', () => {
              fixture.timelineJumps.push(index);
              list.reveal(index, 0);
              open = false;
              update();
              rest.focus();
            });
            jump.addEventListener('focus', () => { open = true; update(); });
            panel.append(jump);
          }
          rail.append(rest, panel);
          document.querySelector('.interactive-session').append(rail);
        }
        return list.length;
      };
      fixture.mountInlineEditor = () => {
        const part = document.createElement('div');
        part.className = 'interactive-input-part';
        const host = document.createElement('div');
        host.className = 'interactive-input-editor';
        part.append(host);
        document.querySelector('.interactive-request').append(part);
        fixture.inlineEditor = monaco.editor.create(host, {
          value: 'Earlier prompt', language: 'plaintext', automaticLayout: true,
          minimap: { enabled: false }, editContext: false,
        });
      };
      fixture.mountHostPicker = (count = 2) => {
        const picker = document.createElement('a');
        picker.className = 'agent-host-filter-button';
        picker.setAttribute('role', 'button');
        picker.setAttribute('aria-label', 'Change host');
        picker.tabIndex = 0;
        picker.textContent = 'Host 0';
        document.querySelector('.part.sidebar').prepend(picker);
        fixture.hostSelections = [];
        fixture.hostMenuOpens = 0;
        let menu;
        let shadowHost;
        const open = () => {
          fixture.hostMenuOpens++;
          menu?.dispose();
          shadowHost?.remove();
          shadowHost = document.createElement('div');
          shadowHost.className = 'shadow-root-host';
          picker.append(shadowHost);
          const shadow = shadowHost.attachShadow({ mode: 'open' });
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = '/fixture-runtime.css';
          shadow.append(css);
          const container = document.createElement('div');
          container.style.cssText = 'position:fixed;top:110px;left:12px;width:280px;z-index:3000;background:white';
          shadow.append(container);
          const actions = Array.from({ length: count }, (_, index) => new Action(
            `agentHostFilter.host.${index}`, `Host ${index}`, '', true, async () => {
              fixture.hostSelections.push(index);
              picker.firstChild.textContent = `Host ${index}`;
            }));
          actions.push(new Action('disabled-host', 'Unavailable host', '', false, async () => {
            fixture.hostSelections.push('disabled');
          }));
          menu = new Menu(container, actions, {}, {});
          menu.focus();
        };
        Gesture.addTarget(picker);
        picker.addEventListener('click', open);
        picker.addEventListener('-monaco-gesturetap', open);
      };
      // The installed app does not export Monaco's API; exercise the DOM bridge.
      window.monaco = undefined;

      const send = () => {
        fixture.sends.push(editor.getValue());
        editor.setValue('');
      };
      document.querySelector('.native-send').addEventListener('click', send);
      document.querySelector('.native-send').addEventListener('-monaco-gesturetap', send);
      document.addEventListener('keydown', event => {
        if (event.key === 'Enter' && editorHost.contains(event.target) && !event.shiftKey) {
          event.preventDefault();
          send();
        }
      }, true);

      const details = document.querySelector('.model-picker-config');
      const showDetails = () => {
        fixture.detailsOpens++;
        const dialog = document.createElement('div');
        dialog.className = 'context-view tabbed-action-list-details';
        dialog.role = 'dialog';
        dialog.setAttribute('aria-label', 'Example Model Details');
        dialog.innerHTML = '<h3>Thinking Level</h3><button data-effort="Low">Low</button>' +
          '<button data-effort="High">High</button><h3>Context Size</h3>' +
          '<button data-context="200K">200K</button><button data-context="1M">1M</button>' +
          '<button data-close>Done</button>';
        dialog.addEventListener('click', event => {
          if (event.target.dataset.effort) {
            details.setAttribute('aria-label', details.getAttribute('aria-label')
              .replace(/Thinking Level: [^,]+/, 'Thinking Level: ' + event.target.dataset.effort));
          }
          if (event.target.dataset.context) {
            details.setAttribute('aria-label', details.getAttribute('aria-label')
              .replace(/Context Size: [^,]+/, 'Context Size: ' + event.target.dataset.context));
          }
          const label = details.getAttribute('aria-label');
          details.textContent = `${label.match(/Thinking Level: ([^,]+)/)[1]} - ${label.match(/Context Size: ([^,]+)/)[1]}`;
          if (event.target.hasAttribute('data-close')) dialog.remove();
        });
        document.body.append(dialog);
      };
      details.addEventListener('mousedown', showDetails);
      document.querySelector('.model-picker-name').addEventListener('mousedown', () => fixture.modelOpens++);

      const tree = document.querySelector('[role="tree"]');
      tree.addEventListener('click', event => {
        const row = event.target.closest('[role="treeitem"]');
        if (event.target.closest('.session-chat-twistie')) {
          row.setAttribute('aria-expanded', String(row.getAttribute('aria-expanded') !== 'true'));
        } else {
          fixture.openedSessions++;
        }
      });
      tree.addEventListener('-monaco-gesturetap', () => fixture.openedSessions++);
      tree.addEventListener('touchstart', () => fixture.nativePointerDowns++);

      const request = document.querySelector('.interactive-request');
      let requestTouchConsumed = false;
      request.addEventListener('pointerdown', event => {
        if (event.pointerType === 'touch') requestTouchConsumed = true;
      });
      request.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          fixture.editKeys.push(event.key);
          event.preventDefault();
          fixture.edits++;
          request.classList.add('editing');
        }
      });
      request.querySelector('.clickable').addEventListener('click', event => {
        if (requestTouchConsumed) return;
        if (!event.target.closest('a') && !window.getSelection().toString()) {
          fixture.edits++;
          request.classList.add('editing');
        }
      });
      document.querySelector('.interactive-session').addEventListener('contextmenu', event => {
        fixture.menus++;
        event.preventDefault();
      });
      document.querySelector('.interactive-session').addEventListener('pointerdown', () => fixture.nativePointerDowns++);
      for (const [label, part, flag] of [
        ['Toggle Side Bar (Ctrl+B)', 'sidebar', 'nosidebar'],
        ['Toggle Side Panel (Ctrl+Alt+B)', 'editor', 'noeditorpane'],
      ]) {
        document.querySelector(`[aria-label="${label}"]`).addEventListener('click', () => {
          const workbench = document.querySelector('.monaco-workbench');
          const opening = workbench.classList.contains(flag);
          workbench.classList.toggle(flag, !opening);
          document.querySelector('.part.' + part).style.display = opening ? 'block' : 'none';
        });
      }
      fixture.ready = true;
    };
  </script>
  <script src="/fixture-runtime.js"></script>
</body>
</html>
